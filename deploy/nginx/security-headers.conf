# Security headers for every page and file (included in each location, since a location's own add_header
# would otherwise drop the server-level ones). Keep the Content-Security-Policy in step with embed-headers.conf.
#
# What the policy allows, and why:
#   script-src  cdn.jsdelivr.net + wasm-unsafe-eval   OCR engine (tesseract.js) loads its worker/WebAssembly from there
#   connect-src cdn.jsdelivr.net + Google Fonts      OCR language data; the service worker caches the fonts itself
#   worker-src  blob:                                tesseract starts its worker from a blob; pdf.js worker is same-origin
#   style-src   'unsafe-inline' + Google Fonts css   React style attributes; Poppins/handwriting fonts
#   font-src    fonts.gstatic.com
#   img-src     https: data: blob:                   uploaded files, thumbnails, images in Markdown files
#   frame-src   blob:                                the browser's own PDF viewer shows uploaded PDFs from a blob URL
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com blob: data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Browsers only honour this over HTTPS (which Coolify's proxy provides).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
