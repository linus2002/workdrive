# WorkDrive: nginx site config (single-page app + service worker).
# TLS is terminated by Coolify's proxy (Traefik/Caddy) in front of this container.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Nothing is uploaded to this server (files live in each browser for now), so requests stay small.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/wasm;

    # Health check for Coolify / Docker.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built JS/CSS have content hashes in their names: cache them for a year.
    # A missing chunk is a real 404, never index.html (the service worker would cache that as the script).
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Service worker: always re-checked, so updates reach people right away.
    location = /sw.js {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Build manifest (the service worker reads it to know which files to cache).
    location /.vite/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Embeddable file viewer (/embed/<id>): may be shown in an iframe on other sites.
    location ^~ /embed/ {
        include /etc/nginx/snippets/embed-headers.conf;
        add_header Cache-Control "no-cache" always;
        rewrite ^ /index.html break;
    }

    # Other dotfiles (.git, .env, ...) are never served.
    location ~ /\.(?!vite/) {
        deny all;
        return 404;
    }

    # Everything else is the app: real files (icons, logo) as-is, any other path gets index.html
    # so links like /folders/123 or /link/abc work when opened directly or reloaded.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
